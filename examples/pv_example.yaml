apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas3.10-models-pv          # 클러스터 전체에서 이 저장소를 부르는 고유 이름
spec:
  capacity:
    storage: 100Ti                 # 이 저장소의 총 용량 선언 (100 테라바이트)
  volumeMode: Filesystem           # 저장소 형식을 '파일 시스템'으로 지정 (가장 일반적임)
  accessModes:
    - ReadOnlyMany                 # 중요 ⭐: 여러 노드에서 동시에 '읽기만' 가능하게 설정
                                   # (학습용 모델 가중치처럼 데이터 보호가 필요할 때 사용)
  persistentVolumeReclaimPolicy: Retain # 중요 ⭐: PVC가 삭제되어도 실제 NAS의 데이터는 '삭제하지 않고 보존'함
  nfs:                             # 실제 물리 저장소 기술로 NFS를 사용함
    path: /models                  # NAS 서버 내부의 실제 폴더 경로
    server: 192.168.3.10           # NAS 서버의 IP 주소
  mountOptions:                    # 운영체제가 저장소를 마운트할 때 사용할 옵션
    - nfsvers=4                    # NFS 버전 4 사용 (보안 및 성능이 구버전보다 우수함)